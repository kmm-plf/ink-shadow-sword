name: Generate Movie
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install
        run: |
          pip install edge-tts opencv-python-headless numpy
          sudo apt-get update && sudo apt-get install -y ffmpeg
          echo "Ready: $(ffmpeg -version 2>&1 | head -1)"
      
      - name: Generate
        run: python3 scripts/generate_images.py
      
      - name: Create Videos
        run: python3 scripts/create_videos.py
      
      - name: Synthesize
        run: python3 scripts/synthesize.py
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ink-shadow-sword
          path: ink-shadow-sword-complete.mp4
