name: Generate Movie
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install edge-tts opencv-python-headless numpy
          sudo apt-get update && sudo apt-get install -y ffmpeg
          echo "ffmpeg installed: $(ffmpeg -version | head -1)"
          echo "python installed: $(python3 --version)"
      
      - name: Generate images
        run: |
          mkdir -p output/{characters,keyframes,scenes,audio}
          cat > generate_images.py << 'EOF'
          import urllib.request, json, ssl, os, time
          
          token = os.environ.get('AGNES_API_KEY', '')
          if not token:
              print("ERROR: AGNES_API_KEY not set")
              exit(1)
          
          headers = {'Authorization': f'Bearer {token}'}
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE
          
          def gen(prompt, path):
              payload = json.dumps({'prompt': prompt, 'size': '1920x1080', 'quality': 'hd'}).encode()
              req = urllib.request.Request('https://api.agnes-ai.space/v1/images/generations', 
                  data=payload, headers={**headers, 'Content-Type': 'application/json'}, method='POST')
              resp = urllib.request.urlopen(req, context=ctx, timeout=120)
              result = json.loads(resp.read())
              if result.get('data'):
                  img = urllib.request.urlopen(result['data'][0]['url'], context=ctx).read()
                  with open(path, 'wb') as f:
                      f.write(img)
                  return True
              return False
          
          chars = {
              'linmo': 'Chinese ink wash painting, young swordsman Lin Mo, 20yo, cyan robe, topknot hair, determined eyes, holding ancient black ink sword, martial arts pose, masterpiece, highly detailed',
              'suwaner': 'Chinese ink wash painting, elegant female swordswoman Su Waner, 18yo, pure white flowing robes, long black hair updo, cold beautiful face, jade sword, fairy-like, masterpiece',
              'xuemojun': 'Chinese ink wash painting, demonic villain Blood Hand Demon Lord, 50yo, black red-accented robes, menacing red face, blood-red broadsword, evil glowing red eyes, dark energy, masterpiece',
              'old_beggar': 'Chinese ink wash painting, mysterious old beggar, 60yo, tattered brown robes, wine gourd, crazy appearance with wise eyes, under ancient pine tree, zen atmosphere, masterpiece'
          }
          
          scenes = [
              ('scene_01', 'Chinese ink wash painting, ancient Chinese town at dawn, morning mist, bluestone paths, distant green mountains, peaceful traditional architecture, golden light, masterpiece'),
              ('scene_02', 'Chinese ink wash painting, blacksmith workshop, forge fire bright orange, sparks flying, young man forging sword, sweat dripping, warm lighting, masterpiece'),
              ('scene_03', 'Chinese ink wash painting, ancient black sword emerging from ground, ink patterns flowing on blade, mystical purple aura, dramatic lighting, masterpiece'),
              ('scene_04', 'Chinese ink wash painting, chase scene, young swordsman running through narrow alleys, shadowy figures pursuing, motion blur, tension, masterpiece'),
              ('scene_05', 'Chinese ink wash painting, female warrior in white fighting multiple enemies, sword light rainbow trails, petals floating, elegant combat, masterpiece'),
              ('scene_06', 'Chinese ink wash painting, moonlit forest, moonbeams through leaves, white-clad woman discovering figure in cave, mysterious atmosphere, masterpiece'),
              ('scene_07', 'Chinese ink wash painting, Mount Wudang peaks through swirling clouds, ancient temple silhouettes, golden sunrise, spiritual atmosphere, masterpiece'),
              ('scene_08', 'Chinese ink wash painting, old beggar drinking wine under ancient tree, wise eyes despite tattered appearance, zen atmosphere, masterpiece'),
              ('scene_09', 'Chinese ink wash painting, epic sword duel, young swordsman vs old master, black and white ink energy colliding, mountains shifting, masterpiece'),
              ('scene_10', 'Chinese ink wash painting, dark red black clouds over Mount Wudang, demonic army marching, Blood Hand Demon Lord on horseback, terrifying atmosphere, masterpiece'),
              ('scene_11', 'Chinese ink wash painting, massive battle, dozens of martial artists fighting demons, sword beams everywhere, epic scale, masterpiece'),
              ('scene_12', 'Chinese ink wash painting, ultimate technique, thousand layers of black ink energy swirling like tsunami, purple lightning, overwhelming power, masterpiece'),
              ('scene_13', 'Chinese ink wash painting, final duel hero vs demon lord, black ink vs red demonic energy, heavens splitting, epic confrontation, masterpiece'),
              ('scene_14', 'Chinese ink wash painting, magical golden seal erupting from ground, brilliant light washing battlefield, demons being sealed, triumphant moment, masterpiece'),
              ('scene_15', 'Chinese ink wash painting, peaceful town restored, golden sunlight through parting clouds, people smiling, birds flying, harmony, masterpiece'),
              ('scene_16', 'Chinese ink wash painting, heroes on mountain peak at sunset overlooking Jianghu, ink scroll unfurling, epic poetic ending, masterpiece')
          ]
          
          print("Generating characters...")
          for cid, prompt in chars.items():
              if gen(prompt, f'output/characters/{cid}.png'):
                  print(f'  OK {cid}')
              time.sleep(1)
          
          print("Generating scenes...")
          for sid, name, prompt in scenes:
              if gen(prompt, f'output/keyframes/{sid}.png'):
                  print(f'  OK {sid}')
              time.sleep(1)
          
          print(f"Done: {len(os.listdir('output/characters'))} chars, {len(os.listdir('output/keyframes'))} scenes")
          EOF
          python3 generate_images.py
      
      - name: Create videos
        run: |
          cat > create_videos.py << 'EOF'
          import cv2, os, json, subprocess, asyncio, edge_tts
          
          os.makedirs('output/scenes', exist_ok=True)
          os.makedirs('output/audio', exist_ok=True)
          
          videos = []
          
          # Scene videos
          print("Creating scene videos...")
          for i, f in enumerate(sorted(os.listdir('output/keyframes'))):
              if f.endswith('.png'):
                  img = cv2.imread(f'output/keyframes/{f}')
                  if img is not None:
                      h, w = img.shape[:2]
                      out = f'output/scenes/scene_{i+1:02d}.mp4'
                      fourcc = cv2.VideoWriter_fourcc(*'mp4v')
                      vw = cv2.VideoWriter(out, fourcc, 24, (1920, 1080))
                      for j in range(24*60):
                          t = j / (24*60)
                          ease = t*t*(3-2*t)
                          zoom = 1.0 + 0.12*ease
                          nw = int(w/zoom); nh = int(h/zoom)
                          x1 = max(0, int((w-nw)/2)+int(5*ease))
                          y1 = max(0, int((h-nh)/2)-int(8*ease))
                          vw.write(cv2.resize(img[y1:y1+nh,x1:x1+nw], (1920,1080), interpolation=cv2.INTER_LANCZOS4))
                      vw.release()
                      videos.append(out)
                      print(f'  OK scene_{i+1:02d}')
          
          # Dialog videos
          dialogs = [
              ('linmo', 'zh-CN-YunxiNeural', '这把剑还没打好，师父说剑要有魂，魂在气中。'),
              ('voice', 'zh-CN-YunyangNeural', '墨影剑认主，凡人，你可愿承担它的命运？'),
              ('xuemojun', 'zh-CN-YunhaoNeural', '墨影剑终于出现了，小娃娃把剑交出来饶你不死。'),
              ('suwaner', 'zh-CN-XiaoyiNeural', '你们这些邪魔外道竟敢追杀无辜之人今日便让你见识见识武当剑法。'),
              ('suwaner', 'zh-CN-XiaoyiNeural', '你是什么人为何持有墨影剑'),
              ('linmo', 'zh-CN-YunxiNeural', '我也不知道它就自己出现在我手里的。'),
              ('old_beggar', 'zh-CN-YunyangNeural', '小子你手里那把剑可是烫手山芋啊继续逃避还是站出来。'),
              ('linmo', 'zh-CN-YunxiNeural', '我明白了墨影不是用来控制的是用来守护的。'),
              ('linmo', 'zh-CN-YunxiNeural', '我不是要赢你我是要终结这一切。'),
              ('linmo', 'zh-CN-YunxiNeural', '我只是做了该做的接下来我们继续守护这片江湖。'),
          ]
          
          print("Creating dialog videos...")
          for i, (char, voice, text) in enumerate(dialogs):
              audio = f'output/audio/dlg_{i+1:02d}.mp3'
              video = f'output/scenes/dialog_{i+1:02d}.mp4'
              
              if not os.path.exists(audio):
                  asyncio.run(edge_tts.Communicate(text, voice).save(audio))
                  print(f'  OK audio {i+1}')
              
              dur = 5.0
              try:
                  r = subprocess.run(['ffprobe','-v','error','-show_entries','format=duration','-of','json',audio], capture_output=True, text=True)
                  dur = float(json.loads(r.stdout)['format']['duration'])
              except: pass
              
              char_img = f'output/characters/{char}.png' if char != 'voice' else 'output/characters/linmo.png'
              if os.path.exists(char_img) and not os.path.exists(video):
                  img = cv2.imread(char_img)
                  if img is not None:
                      h, w = img.shape[:2]
                      fourcc = cv2.VideoWriter_fourcc(*'mp4v')
                      vw = cv2.VideoWriter(video, fourcc, 24, (1920, 1080))
                      for j in range(int(24*dur)):
                          t = j/(24*dur)
                          ease = t*t*(3-2*t)
                          zoom = 1.0 + 0.12*ease
                          nw = int(w/zoom); nh = int(h/zoom)
                          x1 = max(0, int((w-nw)/2)+int(5*ease))
                          y1 = max(0, int((h-nh)/2)-int(8*ease))
                          vw.write(cv2.resize(img[y1:y1+nh,x1:x1+nw], (1920,1080), interpolation=cv2.INTER_LANCZOS4))
                      vw.release()
                      
                      final = video.replace('.mp4', '_f.mp4')
                      subprocess.run(['ffmpeg','-y','-i',video,'-i',audio,'-c:v','copy','-c:a','aac','-shortest',final], capture_output=True)
                      if os.path.exists(final):
                          os.replace(final, video)
                          videos.append(video)
                          print(f'  OK dialog_{i+1}')
          
          with open('output/videos.json', 'w') as f:
              json.dump({'videos': videos}, f)
          print(f"\nTotal: {len(videos)} videos")
          EOF
          python3 create_videos.py
      
      - name: Synthesize movie
        run: |
          cat > synthesize.py << 'EOF'
          import subprocess, os, json
          
          with open('output/videos.json') as f:
              videos = json.load(f)['videos']
          
          print(f'Synthesizing {len(videos)} videos...')
          
          with open('output/list.txt', 'w') as f:
              for v in videos:
                  f.write(f"file '{v}'\n")
          
          r = subprocess.run(['ffmpeg','-y','-f','concat','-safe','0','-i','output/list.txt','-c','copy','-movflags','+faststart','ink-shadow-sword-complete.mp4'],
              capture_output=True, text=True, timeout=600)
          
          if os.path.exists('ink-shadow-sword-complete.mp4'):
              size = os.path.getsize('ink-shadow-sword-complete.mp4') / (1024*1024)
              print(f'SUCCESS: {size:.1f} MB')
          else:
              print(f'FAILED: {r.stderr[:200]}')
              exit(1)
          EOF
          python3 synthesize.py
      
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ink-shadow-sword
          path: ink-shadow-sword-complete.mp4
