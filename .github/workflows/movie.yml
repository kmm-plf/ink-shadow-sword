name: "墨影剑魂 - Generate Movie"

on:
  workflow_dispatch:

jobs:
  generate:
    name: "墨影剑魂"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install edge-tts opencv-python-headless numpy httpx
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          echo "=== Installed ==="
          python3 --version
          ffmpeg -version | head -1
      
      - name: Generate images
        run: python3 scripts/gen_images.py
      
      - name: Create videos
        run: python3 scripts/create_vids.py
      
      - name: Synthesize movie
        run: python3 scripts/synth.py
      
      - name: Upload movie
        uses: actions/upload-artifact@v4
        with:
          name: ink-shadow-sword-complete
          path: ink-shadow-sword-complete.mp4
          retention-days: 90
      
      - name: Summary
        run: |
          SIZE=$(stat -c%s ink-shadow-sword-complete.mp4 2>/dev/null || echo 0)
          echo "## 墨影剑魂 - 完成!" >> $GITHUB_STEP_SUMMARY
          echo "- 文件大小: $((SIZE / 1024 / 1024)) MB" >> $GITHUB_STEP_SUMMARY
          echo "- 请访问 Actions 下载" >> $GITHUB_STEP_SUMMARY
